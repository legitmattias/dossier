# SQLite-only override — no Postgres container
# Usage: docker compose -f docker-compose.yml -f docker-compose.sqlite.yml up -d
#
# Disables the postgres service and configures the API to use SQLite.
# Simpler to self-host, no separate database process.

services:
  postgres:
    deploy:
      replicas: 0

  dossier-api:
    volumes:
      - api-data:/data
    environment:
      - DATABASE_URL=sqlite:/data/dossier.db
      - PORT=3200
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on: []

volumes:
  api-data:
