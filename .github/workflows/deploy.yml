name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/dossier-api
  MCP_IMAGE: ghcr.io/${{ github.repository_owner }}/dossier-mcp
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/dossier-web

jobs:
  # ── Test ───────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dossier
          POSTGRES_PASSWORD: dossier
          POSTGRES_DB: dossier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dossier"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgres://dossier:dossier@localhost:5432/dossier_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # TODO: Fix strict type errors in MCP test files and re-enable
      # - run: pnpm typecheck
      - run: pnpm test

  # ── Build and push Docker images ──────────────────────────
  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          build-args: |
            DOSSIER_COMMIT_SHA=${{ github.sha }}
            DOSSIER_BUILT_AT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:${{ github.sha }}
            ${{ env.MCP_IMAGE }}:latest
          build-args: |
            DOSSIER_COMMIT_SHA=${{ github.sha }}
            DOSSIER_BUILT_AT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            DOSSIER_COMMIT_SHA=${{ github.sha }}
            DOSSIER_BUILT_AT=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ── Deploy ────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /srv/dossier

            # Pull new images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml pull

            # Restart services (postgres untouched if unchanged)
            docker compose -f docker-compose.yml up -d

            # Health checks
            echo "Waiting for services..."
            sleep 10
            curl -sf http://localhost:3200/health || (echo "API health check failed" && exit 1)
            curl -sf -X OPTIONS http://localhost:3150/mcp || (echo "MCP health check failed" && exit 1)
            curl -sf http://localhost:3300 || (echo "Web health check failed" && exit 1)
            echo "Deploy complete."
