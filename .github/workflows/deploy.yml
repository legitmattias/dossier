name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/legitmattias/dossier-api
  MCP_IMAGE: ghcr.io/legitmattias/dossier-mcp

jobs:
  # ── Test ───────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # ── Build and push Docker images ──────────────────────────
  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:${{ github.sha }}
            ${{ env.MCP_IMAGE }}:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

  # ── Deploy ────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /srv/dossier

            # Pull new images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml pull

            # Restart services (postgres untouched if unchanged)
            docker compose -f docker-compose.yml up -d

            # Health checks
            echo "Waiting for services..."
            sleep 10
            curl -sf http://localhost:3200/health || (echo "API health check failed" && exit 1)
            curl -sf -X OPTIONS http://localhost:3150/mcp || (echo "MCP health check failed" && exit 1)
            echo "Deploy complete."
